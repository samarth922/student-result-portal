<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("{{ url_for('static', filename='bg2.jpeg') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            color: white;
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        h2 {
            color: #ece6e6;
        }
        form {
            margin-top: 20px;
        }
        input[type="text"], input[type="number"] {
            padding: 8px;
            width: 200px;
            margin-right: 10px;
        }
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        a {
            text-align: center;
            display: inline-block;
            margin-top: 20px;
            color: #e4e6e9;
            text-decoration: none;
            background-color: rgb(0, 221, 255);
            padding: 5px 10px;
        }
        a:hover {
            text-align: center;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>Admin Panel - Add Student Result</h2>
    <form method="POST">
        Roll No: <input type="text" name="roll_no" required><br><br>
        Name: <input type="text" name="name" required><br><br>
        Marks: <input type="number" name="marks" required><br><br>
        <button type="submit">Add Result</button>
    </form>
    <br>
    <a href="/">Back to Home</a>
</body>
</html>
